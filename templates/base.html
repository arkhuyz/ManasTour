{% load static %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %} ManasTour — места и достопримечательности Манаса
      {%endblock %}
    </title>
    <meta
      name="description"
      content="{% block description %}Путеводитель по достопримечательностям и местам отдыха города Манас, Джалал-Абадская область.{% endblock %}"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=2" />
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <!-- HEADER -->
    {% include "includes/header.html" %}

    <!-- Основная часть страницы -->
    <main class="main-content">{% block content %} {% endblock %}</main>

    <!-- FOOTER -->
    {% include "includes/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %} {% endblock %}
  </body>
</html>
